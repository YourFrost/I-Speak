name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Configurer la signature de release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            {
              echo "MYAPP_STORE_FILE=release.keystore"
              echo "MYAPP_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "MYAPP_KEY_ALIAS=$KEY_ALIAS"
              echo "MYAPP_KEY_PASSWORD=$KEYSTORE_PASSWORD"
            } >> android/gradle.properties
            node scripts/patch-signing.js
          else
            echo "Pas de clé de release : APK signé avec la clé debug (OK pour tester)."
          fi
      - run: cd android && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: i-speak-apk
          path: android/app/build/outputs/apk/release/*.apk
